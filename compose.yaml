services:
  app:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "3077"
      COOKIE_SECURE: "true"
      PUBLIC_ORIGIN: https://${DOMAIN:?Especifica DOMAIN en .env}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      WORK_WEBHOOK_URL: ${WORK_WEBHOOK_URL:-}
    volumes:
      - dos_data:/app/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Especifica DOMAIN en .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  dos_data:
  caddy_data:
  caddy_config:
